# Kaynakça Masası as containers: queue + verification service (x2) + LLM service + web app.
#   node scripts/generate-keys.cjs           # once: RS256 key pairs into ./keys
#   docker compose up --build
# API keys: services/verify/.env and services/llm/.env (see the .env.example files next to them).
# Keys added in the admin panel are kept by the LLM service in the llm-data volume (run one LLM service: replicas stay 1).
# Each container mounts only the public keys and its own private key (as a secret).
# On another server, run any service alone and point QUEUE_URL at the queue's address.
# Do NOT use this file there (QUEUE_URL below is the internal http://queue:4180): use the `docker run` commands in KURULUM.md (section 5.1).
# For remote workers set QUEUE_BIND=<this server's DMZ IP> in .env, otherwise the queue only listens on 127.0.0.1.
name: kaynakca-masasi

x-service: &service
  build: { context: ., target: service }
  image: kaynakca-masasi/service
  restart: unless-stopped
  networks: [default, laravel]
  volumes:
    - ./keys/public:/keys/public:ro

services:
  queue:
    <<: *service
    command: ["node", "services/queue/server.cjs"]
    environment:
      QUEUE_HOST: 0.0.0.0
      QUEUE_PORT: "4180"
      QUEUE_DATA_DIR: /data
      JWT_KEYS_DIR: /keys
    volumes:
      - ./keys/public:/keys/public:ro
      - queue-data:/data
    networks:
      default: {}
      laravel: { aliases: [kaldera-queue] }
    # Published on localhost only (QUEUE_BIND in .env changes the address); open it to other hosts (behind TLS) when services run elsewhere.
    ports: ["${QUEUE_BIND:-127.0.0.1}:4180:4180"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4180/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  verify:
    <<: *service
    # Needs Python to read full-text PDFs for the content check.
    build: { context: ., target: python }
    image: kaynakca-masasi/verify
    command: ["node", "services/verify/index.cjs"]
    environment:
      QUEUE_URL: http://queue:4180
      JWT_KEYS_DIR: /keys
      JWT_PRIVATE_KEY_FILE: /run/secrets/verify_key
    env_file: [{ path: services/verify/.env, required: false }]
    secrets: [verify_key]
    depends_on: { queue: { condition: service_healthy } }
    deploy: { replicas: 2 }

  llm:
    <<: *service
    command: ["node", "services/llm/index.cjs"]
    environment:
      QUEUE_URL: http://queue:4180
      JWT_KEYS_DIR: /keys
      JWT_PRIVATE_KEY_FILE: /run/secrets/llm_key
      LLM_DATA_DIR: /data/llm   # API keys added from the admin panel (sealed) live here
    env_file: [{ path: services/llm/.env, required: false }]
    volumes:
      - ./keys/public:/keys/public:ro
      - llm-data:/data/llm
    secrets: [llm_key]
    depends_on: { queue: { condition: service_healthy } }

  web:
    build: { context: ., target: web }
    image: kaynakca-masasi/web
    restart: unless-stopped
    environment:
      QUEUE_URL: http://queue:4180
      JWT_KEYS_DIR: /keys
      JWT_PRIVATE_KEY_FILE: /run/secrets/web_key
      # From the .env next to this file (see KURULUM.md, section 10): public address, accepted host names, reverse proxy in front.
      PUBLIC_URL: ${PUBLIC_URL:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
    volumes:
      - ./keys/public:/keys/public:ro
      - web-data:/data
    secrets: [web_key]
    networks:
      default: {}
      laravel: { aliases: [kaldera-web] }
    ports: ["${WEB_BIND:-127.0.0.1}:4173:4173"]
    depends_on: { queue: { condition: service_healthy } }

networks:
  # Existing network shared with the other containers on this server (create it once if missing: docker network create mansur_laravel_net).
  laravel:
    name: mansur_laravel_net
    external: true

secrets:
  web_key: { file: ./keys/private/web.private.pem }
  verify_key: { file: ./keys/private/verify.private.pem }
  llm_key: { file: ./keys/private/llm.private.pem }

volumes:
  queue-data:
  llm-data:
  web-data:
